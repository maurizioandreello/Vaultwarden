# /etc/nginx/sites-enabled/pass.gatet1.it — gestore password Gate T1
# (Vaultwarden, container su 127.0.0.1:8081).
#
# - :80 solo per la challenge ACME di certbot (webroot /var/www/letsencrypt,
#   lo stesso usato da wsportal.conf); tutto il resto redirect 301 a https.
# - :443 e' raggiungibile SOLO dalle sorgenti della address-list TRUSTED
#   del router CCR-1: /etc/nginx/snippets/vault-trusted.conf e' generato
#   da trusted/vault_trusted.py (timer systemd vault-trusted.timer) e
#   contiene righe `allow ...;` + `deny all;`. Se il file manca nginx -t
#   fallisce: generarlo PRIMA di abilitare questo vhost (vedi README).
# - /admin e /api/public rispondono 404 da internet:
#   * il pannello admin si usa solo in locale via tunnel SSH
#     (ssh -L 8081:127.0.0.1:8081 wsportal, poi http://localhost:8081/admin);
#   * l'API pubblica dell'organizzazione sara' usata solo dal backend
#     wsportal attraverso la rete docker `vault` (fase 2).
# - Gli header di sicurezza sono definiti qui e NON si include
#   security-headers.conf di wsportal: li' X-Frame-Options e' DENY, per la
#   web vault serve SAMEORIGIN (alcuni client la caricano in frame).
#
# La map per l'upgrade websocket ha nome univoco ($vault_connection_upgrade)
# per non collidere con eventuali map gia' definite nel blocco http.

map $http_upgrade $vault_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name pass.gatet1.it;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pass.gatet1.it;

    ssl_certificate /etc/letsencrypt/live/pass.gatet1.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pass.gatet1.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Solo sorgenti TRUSTED (file generato, non modificare a mano).
    include /etc/nginx/snippets/vault-trusted.conf;

    # Vaultwarden: allegati fino a 128 MB (allineare ORG_ATTACHMENT_LIMIT
    # se si alza questo valore).
    client_max_body_size 128M;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Pannello admin: solo via tunnel SSH su 127.0.0.1:8081 (vedi README).
    location /admin {
        return 404;
    }

    # API pubblica organizzazione: solo dalla rete docker `vault` (fase 2).
    location /api/public {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sovrascrive (non concatena), come nello snippet wsportal-app.conf.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Websocket (/notifications/hub): upgrade solo quando richiesto.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vault_connection_upgrade;
        # Le connessioni websocket restano aperte a lungo.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
